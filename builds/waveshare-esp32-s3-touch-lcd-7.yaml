# =============================================================================
# BUILD PROFILE - Waveshare ESP32-S3-Touch-LCD-7
# =============================================================================
# CI/local build entry point for the 7" 800x480 ESP32-S3 panel.
# =============================================================================

substitutions:
  name: "espcontrol-ws-s3-7"
  friendly_name: "Waveshare ESP32-S3 Touch LCD 7"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"

esphome:
  name_add_mac_suffix: true

packages:
  espcontrol: !include ../devices/waveshare-esp32-s3-touch-lcd-7/packages.yaml

wifi:
  ap:
    ssid: "${friendly_name}"

captive_portal:
