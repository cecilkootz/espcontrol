# =============================================================================
# FACTORY BUILD - Waveshare ESP32-S3-Touch-LCD-7
# =============================================================================
# Factory image: www.js bundled inline for first-boot web UI access.
# =============================================================================

substitutions:
  firmware_version: "0.0.0"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"

packages:
  core: !include waveshare-esp32-s3-touch-lcd-7.yaml

esphome:
  project:
    name: jtenniswood.espcontrol
    version: "${firmware_version}"

dashboard_import:
  package_import_url: github://jtenniswood/espcontrol/devices/waveshare-esp32-s3-touch-lcd-7/esphome.yaml@main

web_server:
  port: 80
  version: 3
  js_url: ""
  js_include: "../docs/public/webserver/waveshare-esp32-s3-touch-lcd-7/www.js"
